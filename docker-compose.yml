services:
  mysql:
    image: mysql:8.0
    container_name: retail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@2026}
      MYSQL_DATABASE: retail_saas
      MYSQL_USER: retail
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Retail@2026}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: retail-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: retail-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-retail}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Retail@2026}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: retail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-retailminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Retail@2026}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    container_name: retail-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/retail_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: retail
      DB_PASSWORD: ${MYSQL_PASSWORD:-Retail@2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-retail}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-Retail@2026}
      JWT_SECRET: ${JWT_SECRET:-retail-convenience-saas-platform-2026-secret-key-must-be-long-enough}
      STORAGE_ROOT: /app/data/uploads
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/data/uploads
    ports:
      - "8080:8080"

  web-admin:
    build:
      context: ./web-admin
      args:
        VITE_BASE: /admin/
    container_name: retail-web-admin
    restart: unless-stopped

  web-portal:
    build: ./web-portal
    container_name: retail-web-portal
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: retail-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - web-admin
      - web-portal
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  upload-data:
