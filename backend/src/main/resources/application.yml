server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: 100MB

spring:
  application:
    name: retail-convenience
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/retail_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:retail}
    password: ${DB_PASSWORD:Retail@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:3}
      timeout: 5s
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:retail-convenience-saas-platform-2026-secret-key-must-be-long-enough}
    expire-hours: 12
  tenant:
    default-code: yxbl
  storage:
    local-root: ${STORAGE_ROOT:./data/uploads}
    public-prefix: /uploads
  upload:
    allowed-image-types: image/jpeg,image/png,image/gif,image/webp,image/bmp
    max-image-size: 2097152

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.retail.convenience: INFO
    org.springframework.web: WARN
  file:
    name: logs/retail-convenience.log
